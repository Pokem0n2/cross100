<!DOCTYPE html>
<html lang="en" data-theme="valley">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Cross — Color Puzzle</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg1:#f5ebe0;--bg2:#eddecf;
  --hdr:rgba(245,235,224,.92);
  --grid:#cdc1b4;
  --cell-empty:rgba(187,173,160,.12);
  --txt:#5a4e44;--txt-l:#f9f6f2;--txt-m:#8b7e74;
  --accent:#b87060;
  --glow:rgba(184,112,96,.35);
  --sh:rgba(90,78,68,.12);
  --rad:16px;--crad:8px;--gap:4px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;
  --speed:.3s;
  --easy:#7aab6b;
  --medium:#c8b860;
  --hard:#b86868;
  --hell:#3d3535;
}
[data-theme="pixel"]{
  --bg1:#0a0a1a;--bg2:#12122a;
  --hdr:rgba(10,10,26,.95);
  --grid:#1a1a3a;
  --cell-empty:rgba(30,30,80,.25);
  --txt:#e0e0ff;--txt-l:#fff;--txt-m:#6060a0;
  --accent:#ffd700;
  --glow:rgba(255,215,0,.3);
  --sh:rgba(0,0,0,.4);
  --rad:4px;--crad:2px;--gap:3px;
  --font:'Courier New',Consolas,monospace;
  --speed:.15s;
  --easy:#2ecc71;
  --medium:#f1c40f;
  --hard:#e74c3c;
  --hell:#ffd700;
}

html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--txt);
  display:flex;justify-content:center;align-items:center;
  -webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:background .6s;
}

/* BG deco */
[data-theme="valley"] body::before{
  content:'';position:fixed;inset:-50%;width:200%;height:200%;
  background:
    radial-gradient(circle at 20% 30%,rgba(184,112,96,.06),transparent 50%),
    radial-gradient(circle at 80% 70%,rgba(106,175,184,.06),transparent 50%);
  pointer-events:none;animation:bgF 30s ease-in-out infinite;
}
@keyframes bgF{0%,100%{transform:translate(0,0)}50%{transform:translate(2%,-2%)}}
[data-theme="pixel"] body::before{
  content:'';position:fixed;inset:0;
  background:linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
  background-size:24px 24px;pointer-events:none;
}
[data-theme="pixel"] body::after{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.5));
  pointer-events:none;
}

/* Layout */
#app{
  position:relative;
  width:100%;max-width:440px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) 12px 12px;
}

/* Header */
header{width:100%;display:flex;flex-direction:column;gap:8px;padding:10px 0;position:relative;z-index:10}
.hdr-top{display:flex;align-items:center;justify-content:space-between}
.logo{font-size:22px;font-weight:300;letter-spacing:8px;text-transform:uppercase}
[data-theme="pixel"] .logo{font-weight:700;letter-spacing:4px;text-shadow:0 0 10px var(--accent)}
.hdr-btns{display:flex;gap:8px}
.btn{
  font-family:var(--font);background:var(--accent);color:var(--txt-l);
  border:none;border-radius:var(--crad);padding:8px 16px;
  font-size:12px;font-weight:600;letter-spacing:1px;cursor:pointer;
  transition:all .2s;
}
.btn:active{transform:scale(.95)}
.btn-icon{width:36px;height:36px;padding:0;display:flex;align-items:center;justify-content:center;
  background:rgba(187,173,160,.3);color:var(--txt);border:1px solid var(--grid);font-size:16px;border-radius:50%;
  line-height:1;text-align:center}
[data-theme="pixel"] .btn-icon{background:rgba(30,30,80,.85)}
[data-theme="pixel"] .btn{background:#c0392b}
.btn-icon.disabled{opacity:.35;cursor:default;pointer-events:none}
.lang-btn{font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:0;padding:4px 8px;
  background:transparent;color:var(--txt);border:1px solid var(--grid);border-radius:var(--crad);cursor:pointer;line-height:1}
[data-theme="pixel"] .lang-btn{border-color:rgba(255,255,255,.15)}

.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:30px}
.seed-row{text-align:center;font-size:11px;color:var(--txt-m);letter-spacing:.5px;margin-top:4px;font-family:'Courier New',Consolas,monospace}
.seed-btns{display:flex;justify-content:center;gap:8px;margin-top:6px}
.btn-sm{font-size:10px;padding:4px 10px;letter-spacing:.5px}
.seed-input{width:100%;padding:10px 12px;border:1px solid var(--grid);border-radius:var(--crad);font-size:16px;font-family:'Courier New',Consolas,monospace;background:var(--bg1);color:var(--txt);text-align:center;letter-spacing:3px;margin:0 0 16px;outline:none;line-height:1.8;box-sizing:border-box}
.seed-input:focus{border-color:var(--accent)}
.grid-textarea{width:100%;padding:8px;border:1px solid var(--grid);border-radius:var(--crad);font-size:11px;font-family:'Courier New',Consolas,monospace;background:var(--bg1);color:var(--txt);resize:none;outline:none;line-height:1.5;box-sizing:border-box;letter-spacing:0}
.grid-textarea:focus{border-color:var(--accent)}
.stat{
  background:var(--cell-empty);border:1px solid var(--grid);
  border-radius:var(--crad);padding:5px 12px;
  display:flex;flex-direction:column;align-items:center;min-width:64px;
  transition:all .4s;
}
.stat-l{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--txt-m)}
.stat-v{font-size:20px;font-weight:600;color:var(--txt);transition:transform .2s,color .2s}
.stat-v.pop{animation:spop .3s ease}
@keyframes spop{0%{transform:scale(1)}40%{transform:scale(1.25);color:var(--accent)}100%{transform:scale(1)}}

/* Grid */
#game{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
#gwrap{
  position:relative;width:min(92vw,400px);aspect-ratio:1;
  border-radius:var(--rad);overflow:hidden;
  margin-bottom:55px;
  transform:translateY(-15px);
}
#grid{
  width:100%;height:100%;
  display:grid;grid-template-columns:repeat(var(--n,10),1fr);
  gap:var(--gap);padding:var(--gap);
  background:var(--grid);border-radius:var(--rad);
  transition:background .5s;
}
#grid.n4{--n:4;--gap:8px}
#grid.n6{--n:6;--gap:6px}
#grid.n8{--n:8;--gap:5px}
#grid.n10{--n:10;--gap:4px}
[data-theme="pixel"] #grid::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 1px,transparent 1px 3px);
  pointer-events:none;border-radius:var(--rad);z-index:5;
}

.cell{
  background:var(--cell-empty);border-radius:var(--crad);
  cursor:pointer;position:relative;
  transition:background-color var(--speed),transform .12s,box-shadow .25s;
  will-change:transform,background-color;
}
.cell:active{transform:scale(.88)}

.cell.tap{animation:tapA .35s ease}
@keyframes tapA{0%{transform:scale(1)}40%{transform:scale(.82)}100%{transform:scale(1)}}
.cell.pop{animation:popA .3s ease}
@keyframes popA{0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.cell.gone{animation:goneA .4s ease-out}
@keyframes goneA{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.3}100%{transform:scale(1);opacity:1}}
.cell.hint{
  box-shadow:0 0 0 3px var(--accent),0 0 20px var(--glow);
  z-index:10;animation:hintA .7s ease;
}
@keyframes hintA{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}

@keyframes shake{
  0%,100%{transform:translate(0,0)}
  20%{transform:translate(-2px,1px)}40%{transform:translate(2px,-1px)}
  60%{transform:translate(-1px,2px)}80%{transform:translate(1px,-2px)}
}
#grid.shake{animation:shake .2s ease}

/* Canvas */
#cv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* Overlay */
.ov{
  position:fixed;inset:0;z-index:100;
  background:rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:opacity .4s;
}
.ov.hide{opacity:0;pointer-events:none}
.ov-card{
  background:var(--hdr);border:1px solid var(--grid);
  border-radius:var(--rad);padding:32px 40px;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  max-width:340px;width:90%;
}
.ov-icon{font-size:48px;margin-bottom:8px}
.ov-title{font-size:24px;font-weight:300;letter-spacing:4px;margin-bottom:12px}
[data-theme="pixel"] .ov-title{font-weight:700;text-shadow:0 0 15px var(--accent)}
.ov-score{font-size:18px;color:var(--txt);margin-bottom:8px}
.ov-msg{font-size:14px;color:var(--txt-m);margin-bottom:4px}
.btn-pri{padding:12px 32px;font-size:14px;letter-spacing:2px;margin-top:8px}

/* Footer */
footer{display:flex;gap:8px;padding:10px 0;justify-content:space-between;width:100%}
.undo-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:102px;background:none;border:none;padding:4px;cursor:pointer;color:var(--txt);opacity:.5;transition:opacity .2s;z-index:5}
.undo-btn:hover,.undo-btn:active{opacity:.8}
.undo-btn.disabled{opacity:.15;cursor:default;pointer-events:none}

/* Help overlay */
.help-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.55);
  display:flex;align-items:center;justify-content:center;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:opacity .4s;
}
.help-overlay.hide{opacity:0;pointer-events:none}
.help-card{
  background:var(--hdr);border:1px solid var(--grid);
  border-radius:var(--rad);padding:28px 32px;
  max-width:360px;width:90%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  text-align:left;font-size:14px;line-height:1.8;color:var(--txt);
}
.help-card h3{text-align:center;font-size:18px;font-weight:300;letter-spacing:4px;margin-bottom:16px;color:var(--accent)}
[data-theme="pixel"] .help-card h3{font-weight:700;text-shadow:0 0 10px var(--accent)}
.help-card p{margin-bottom:8px}
.help-card .help-hint{text-align:center;font-size:12px;color:var(--txt-m);margin-top:12px}

/* Launcher */
#launcher{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:18px;width:100%;padding:20px 0 0;margin-top:-50px}
.launch-title{font-size:32px;font-weight:200;letter-spacing:10px;margin-bottom:20px;text-transform:uppercase;display:none}
.launch-sub{font-size:12px;color:var(--txt-m);letter-spacing:3px;margin-bottom:30px;text-transform:uppercase}
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:360px}
.level-btn{
  font-family:var(--font);
  background:var(--hdr);border:2px solid var(--grid);
  border-radius:var(--rad);
  padding:24px 16px;
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  transition:all .25s;
  position:relative;overflow:hidden;
}
.level-btn::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,var(--lvl-color,.7aab6b),transparent 70%);
  opacity:.15;pointer-events:none;
}
.level-btn:active{transform:scale(.97)}
.level-btn .lvl-name{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--lvl-color)}
.level-btn .lvl-grid{display:grid;gap:2px;width:60px;height:60px;margin:6px 0}
.level-btn .lvl-grid div{border-radius:2px;background:var(--lvl-color);opacity:.6}
.level-btn .lvl-meta{font-size:10px;color:var(--txt-m);letter-spacing:1px}
.level-btn .lvl-desc{font-size:11px;color:var(--txt-m);line-height:1.3;max-width:140px}
[data-theme="pixel"] .level-btn .lvl-name{text-shadow:0 0 8px var(--lvl-color)}

.hide{display:none!important}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="hdr-top">
      <span class="logo" id="logo" style="cursor:pointer">CROSS</span>
      <div class="hdr-btns">
        <button class="lang-btn btn-icon" id="blang" style="font-size:11px;font-weight:600;letter-spacing:1px">EN</button>
        <button class="btn-icon" id="bh" title="Help">?</button>
      </div>
    </div>
    <div class="stats" id="statsRow" style="display:none">
      <div class="stat"><span class="stat-l" data-i18n="taps">Taps</span><span class="stat-v" id="sc">0</span></div>
      <div class="stat"><span class="stat-l" data-i18n="left">Left</span><span class="stat-v" id="rm">—</span></div>
    </div>
    <div class="seed-row" id="seedRow" style="display:none"><span data-i18n="seed">seed</span>：<span id="seedVal">—</span></div>
    <div class="seed-btns" id="seedBtns" style="display:none">
      <button class="btn btn-sm" id="bLoadSeed" data-i18n="loadSeed">Load Seed</button>
      <button class="btn btn-sm" id="bImport" data-i18n="importMatrix">Import Matrix</button>
      <button class="btn btn-sm" id="bCopySeed" data-i18n="copySeed">Copy Seed</button>
    </div>
  </header>

  <!-- Launcher -->
  <div id="launcher">
    <div class="launch-title">CROSS</div>
    <div class="launch-sub" data-i18n="selectDifficulty">Select Difficulty</div>
    <div class="level-grid">
      <button class="level-btn" data-level="4" style="--lvl-color:var(--easy)">
        <div class="lvl-name" data-i18n="easy">EASY</div>
        <div class="lvl-grid" style="grid-template-columns:repeat(4,1fr)" id="preview4"></div>
        <div class="lvl-meta">4 × 4 · 3 colors</div>
        <div class="lvl-desc" data-i18n="easyDesc">Tap blocks to clear — the entire row and column each drop one color level.</div>
      </button>
      <button class="level-btn" data-level="6" style="--lvl-color:var(--medium)">
        <div class="lvl-name" data-i18n="medium">MEDIUM</div>
        <div class="lvl-grid" style="grid-template-columns:repeat(6,1fr)" id="preview6"></div>
        <div class="lvl-meta">6 × 6 · 5 colors</div>
        <div class="lvl-desc" data-i18n="mediumDesc">More cells and colors — same rules, deeper strategy.</div>
      </button>
      <button class="level-btn" data-level="8" style="--lvl-color:var(--hard)">
        <div class="lvl-name" data-i18n="hard">HARD</div>
        <div class="lvl-grid" style="grid-template-columns:repeat(8,1fr)" id="preview8"></div>
        <div class="lvl-meta">8 × 8 · 7 colors</div>
        <div class="lvl-desc" data-i18n="hardDesc">7 colors. Plan 15 blocks of clear in your final tap.</div>
      </button>
      <button class="level-btn" data-level="10" style="--lvl-color:var(--hell)">
        <div class="lvl-name" data-i18n="hell">HELL</div>
        <div class="lvl-grid" style="grid-template-columns:repeat(10,1fr)" id="preview10"></div>
        <div class="lvl-meta">10 × 10 · 9 colors</div>
        <div class="lvl-desc" data-i18n="hellDesc">Full board. Only for the brave.</div>
      </button>
    </div>
  </div>

  <main id="game" style="display:none">
    <div id="gwrap">
      <div id="grid"></div>
      <canvas id="cv"></canvas>
    </div>
  </main>
  <footer id="ftr" style="display:none">
    <button class="btn-icon" id="bt" title="Switch Theme"><svg width="16" height="16" viewBox="0 0 16 16"><polygon points="8,1 15,8 8,15,1,8" fill="currentColor" stroke="none"/></svg></button>
    <button class="btn" id="bn2" data-i18n="newGame">NEW GAME</button>
    <button class="btn-icon disabled" id="bc" title="Show Solution"><svg width="16" height="16" viewBox="0 0 16 16"><polygon points="3,0 16,8 3,16" fill="currentColor" stroke="none"/></svg></button>
  </footer>
  <button class="undo-btn disabled" id="bu" style="display:none" title="Undo"><svg width="20" height="20" viewBox="0 0 16 16"><path d="M3 8h7a3 3 0 0 1 0 6H9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 5L3 8l3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="ov hide" id="ov">
    <div class="ov-card">
      <div class="ov-icon" id="oi">✦</div>
      <h2 class="ov-title" id="ot">CLEARED!</h2>
      <p class="ov-score"><span data-i18n="taps">Taps</span>: <strong id="fs">0</strong></p>
      <p class="ov-msg" id="om"></p>
      <button class="btn btn-pri" id="bx" data-i18n="newGame">NEW GAME</button>
    </div>
  </div>
  <div class="help-overlay hide" id="seedOv" style="align-items:flex-start;padding-top:15vh">
    <div class="help-card">
      <h3 data-i18n="loadSeedTitle">LOAD SEED</h3>
      <p style="margin-bottom:12px;color:var(--txt-m);font-size:12px;text-align:center" data-i18n="loadSeedHint">Enter seed ID to load a level</p>
      <input class="seed-input" id="seedIn" type="text" maxlength="8" placeholder="xxxxxxxx" autocomplete="off" spellcheck="false" inputmode="hex">
      <div style="text-align:center"><button class="btn btn-pri" id="seedConfirm" data-i18n="confirm">Confirm</button></div>
      <p class="help-hint" data-i18n="tapOutside">Tap outside to close</p>
    </div>
  </div>
  <div class="help-overlay hide" id="importOv" style="align-items:flex-start;padding-top:8vh">
    <div class="help-card">
      <h3 data-i18n="importGridTitle">IMPORT GRID</h3>
      <p style="margin-bottom:8px;color:var(--txt-m);font-size:12px;text-align:center" data-i18n="importGridHint">Paste N×N number matrix (comma or space separated, -1 for empty)</p>
      <textarea class="grid-textarea" id="gridIn" rows="10" spellcheck="false" placeholder="3,3,2,7,6,2,3,2,5,2\n1,0,-1,4,3,-1,0,-1,4,-1\n..."></textarea>
      <div style="text-align:center"><button class="btn btn-pri" id="importConfirm" data-i18n="confirm">Confirm</button></div>
      <p class="help-hint" data-i18n="tapOutside">Tap outside to close</p>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* ═══ Level configuration ═══ */
// For each level: N (grid size), MAX (max color index), and the color set
const LEVELS={
  4:  {n:4,  max:2,  desc:'Tap a block — its row + column each drop one color level. Final tap must clear exactly 7 blocks.'},
  6:  {n:6,  max:4,  desc:'6×6 grid, 6 colors. Plan a sequence so your last move clears exactly 11 blocks.'},
  8:  {n:8,  max:6,  desc:'8×8 grid, 8 colors. Final tap must clear exactly 15 blocks.'},
  10: {n:10, max:8,  desc:'10×10 grid, full 9 colors. Final tap must clear exactly 19 blocks.'},
};
const TARGET_FN=n=>2*n-1;  // number of cells affected per tap (n row + n col - 1 cross)

/* Full color palette (9 levels + 1 empty) */
const PALETTE=[
  {v:'#a8a098',p:'#7f8c8d'},//0 gray
  {v:'#b86868',p:'#e74c3c'},//1 red
  {v:'#c89060',p:'#e67e22'},//2 orange
  {v:'#c8b860',p:'#f1c40f'},//3 yellow
  {v:'#7aab6b',p:'#2ecc71'},//4 green
  {v:'#6baa9f',p:'#1abc9c'},//5 cyan
  {v:'#6b8fb8',p:'#3498db'},//6 blue
  {v:'#9b7fb8',p:'#9b59b6'},//7 purple
  {v:'#3d3535',p:'#2c3e50'},//8 black
];

/* ═══ State (current run) ═══ */
let N=10, MAX=8, TARGET=TARGET_FN(N), currentLevel=10;
let grid=[],taps=0,busy=false,theme='valley',lang='en',lastGray=0,sol=[],cracking=false,crackStop=false,initGrid=null,tapped=false,undoStack=[],curSeed=0;
// pendingResult holds 'win' or 'fail' set by tap(); tryJudge() fires the banner
// only when all animation state arrays are empty (animation fully resolved).
let pendingResult=null;

/* ═══ state ═══ */
/* grid/taps/busy/etc. declared in State block above */
const T={
  en:{
    easy:'EASY',medium:'MEDIUM',hard:'HARD',hell:'HELL',
    taps:'Taps',left:'Left',seed:'seed',loadSeed:'Load Seed',importMatrix:'Import Matrix',
    selectDifficulty:'Select Difficulty',
    easyDesc:'Tap blocks to clear — the entire row and column each drop one color level.',
    mediumDesc:'More cells and colors — same rules, deeper strategy.',
    hardDesc:'7 colors. Plan 15 blocks of clear in your final tap.',
    hellDesc:'Full board. Only for the brave.',
    copySeed:'Copy Seed',newGame:'NEW GAME',confirm:'Confirm',
    helpTitle:'HOW TO PLAY',
    helpGoal:'<b>Goal:</b><br>On your final tap, clear exactly <b>{n}</b> gray blocks to win.',
    helpOp:'<b>How:</b><br>Tap any block — its entire <b>row + column</b> each drop one color level. Empty blocks are unaffected.',
    helpColors:'<b>Colors:</b><br>Black → Purple → Blue → Cyan → Green → Yellow → Orange → Red → Gray → Empty',
    helpScore:'<b>Score:</b><br>Fewer taps is better.',

/* ═══ seed / PRNG ═══ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}
function showSeed(){$('seedVal').textContent=curSeed.toString(16).padStart(8,'0')}

/* ═══ level gen (stacking) — uses current N & MAX ═══ */
function gen(seed){
  const rng=seed!=null?mulberry32(seed):Math.random;
  const g=[],seq=[];
  for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++)g[r][c]=-1}
  while(true){
    const r=Math.floor(rng()*N),c=Math.floor(rng()*N);
    let exceed=false;
    for(let i=0;i<N;i++){if(g[r][i]>=MAX||g[i][c]>=MAX){exceed=true;break}}
    if(exceed)break;
    for(let i=0;i<N;i++){g[r][i]++;if(i!==r)g[i][c]++}
    seq.push({r,c});
  }
  return{grid:g,sol:seq.reverse()};
}

/* ═══ tap logic ═══ */
function tap(r,c){
  if(grid[r][c]<0)return;
  if(!cracking&&busy)return;
  busy=true;
  if(!cracking){taps++;popSc();if(!tapped){tapped=true;$('bc').classList.add('disabled');}}
  undoStack.push(grid.map(row=>[...row]));$('bu').classList.remove('disabled');
  emitSW(r,c);

  /* ── compute affected cells ── */
  const aff=[];
  for(let cc=0;cc<N;cc++)if(grid[r][cc]>=0)aff.push({r,c:cc,d:Math.abs(cc-c)});
  for(let rr=0;rr<N;rr++)if(rr!==r&&grid[rr][c]>=0)aff.push({r:rr,c,d:Math.abs(rr-r)});

  const tapEl=$g.children[r*N+c];
  if(tapEl){tapEl.classList.add('tap');setTimeout(()=>tapEl.classList.remove('tap'),350)}

  /* ── grid update + gray count (sync — game logic must be immediate) ── */
  const gone=[];
  const grayClr=[];
  for(const cell of aff){
    if(grid[cell.r][cell.c]===0)grayClr.push(1);
    grid[cell.r][cell.c]--;
    if(grid[cell.r][cell.c]<-1)grid[cell.r][cell.c]=-1;
    if(grid[cell.r][cell.c]===-1)gone.push({r:cell.r,c:cell.c});
  }

  /* ── win/fail check: data is correct immediately, but the banner waits for animation ── */
  let res='continue';
  if(!cracking){
    const gc=grayClr.length;
    lastGray=gc;
    res=chkGray(gc);
    // Store result; tryJudge() in tickParts fires showWin/showFail only when ALL
    // animation state arrays (shockwaves, rings, diamonds, parts) and pendingFx are empty.
    if(res==='win'||res==='fail')pendingResult=res;
  }

  /* ── visual fx: queued, triggered when shockwave head reaches each cell ── */
  const tapCell=$g.children[r*N+c];
  const tapCr=tapCell?tapCell.getBoundingClientRect():null;
  const cvr=$cv.getBoundingClientRect();
  pendingFx={
    affected:aff.map(x=>{
      // Clicked cell itself — mark done immediately (no beam reaches it)
      const isClick=x.r===r&&x.c===c;
      return {r:x.r,c:x.c,d:x.d,key:x.r*N+x.c,done:!!isClick}
    }),
    gone:gone.map(g=>{
      // Clicked cell itself if it ended up in gone — mark done immediately
      const isClick=g.r===r&&g.c===c;
      return {r:g.r,c:g.c,key:g.r*N+g.c,done:!!isClick}
    }),
    result:res,
    _tapRow:r,_tapCol:c,
    _tapCx:tapCr?tapCr.left-cvr.left+tapCr.width/2:0,
    _tapCy:tapCr?tapCr.top-cvr.top+tapCr.height/2:0
  };
  // Fire the clicked cell's visual fx right away (it's the laser origin, no beam "arrives")
  const selfEl=$g.children[r*N+c];
  if(selfEl){selfEl.classList.add('pop');setTimeout(()=>selfEl.classList.remove('pop'),300)}
  upd(r,c);
  // If clicked cell is in `gone`, fire its gone animation too (with same 40ms head-pass delay)
  const isSelfGone=!!pendingFx.gone.find(g=>g.done);
  if(isSelfGone){
    setTimeout(()=>{
      if(selfEl){selfEl.classList.add('gone');setTimeout(()=>selfEl.classList.remove('gone'),400)}
      emit(r,c);
    },40);
  }
  // SAFETY NET: if for any reason the shockwave-arrival-driven fx state machine
  // fails to complete (e.g. DOM rebuild, hit-detection edge case), force-unlock busy
  // after 2.5s so the player is never stuck. Also clear pendingFx and any lingering
  // shockwaves so the next tap() starts clean.
  const thisPendingFx=pendingFx;
  setTimeout(()=>{
    if(pendingFx===thisPendingFx){
      // Still unlocked. Force everything done.
      pendingFx.affected.forEach(c=>c.done=true);
      pendingFx.gone.forEach(g=>{
        if(!g.done){
          g.done=true;
          const gel=$g.children[g.r*N+g.c];
          if(gel){gel.classList.add('gone');setTimeout(()=>gel.classList.remove('gone'),400)}
          emit(g.r,g.c);
        }
      });
      if(theme==='pixel'&&pendingFx.affected.length>0){$g.classList.add('shake');setTimeout(()=>$g.classList.remove('shake'),120)}
      busy=false;
      pendingFx=null;
    }
  },2500);
}

function chkGray(gc){
  let rem=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]>=0)rem++;
  if(rem===0&&gc===TARGET)return 'win';
  if(rem===0&&gc!==TARGET)return 'fail';
  return 'continue';
}
function checkStuck(){
  let remaining=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]>=0)remaining++;
  return remaining<TARGET;
}

/* ═══ universal solver ═══ */
function universalSolver(g){
  const n=N;
  /* D[i][j] = required decrement for cell (i,j) */
  const D=[];let T=0;
  for(let i=0;i<n;i++){D[i]=[];for(let j=0;j<n;j++){D[i][j]=g[i][j]>=0?g[i][j]+1:0;T+=D[i][j]}}
  if(T%TARGET!==0)return null;
  const S=T/TARGET;
  /* row/col sums of D */
  const Di=[],Ej=[];
  for(let i=0;i<n;i++){Di[i]=0;for(let j=0;j<n;j++)Di[i]+=D[i][j]}
  for(let j=0;j<n;j++){Ej[j]=0;for(let i=0;i<n;i++)Ej[j]+=D[i][j]}
  /* A[i]=row taps, B[j]=col taps */
  const A=[],B=[];
  for(let i=0;i<n;i++){A[i]=(Di[i]-S)/9;if(A[i]<0||A[i]!==Math.round(A[i]))return null}
  for(let j=0;j<n;j++){B[j]=(Ej[j]-S)/9;if(B[j]<0||B[j]!==Math.round(B[j]))return null}
  /* Z[i][j]=taps at (i,j) */
  const taps=[];
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const z=A[i]+B[j]-D[i][j];
    if(g[i][j]>=0&&z<0)return null;
    if(g[i][j]<0&&z!==0)return null;
    for(let k=0;k<z;k++)taps.push({r:i,c:j});
  }
  /* schedule taps: greedy by descending cell value */
  taps.sort((a,b)=>g[b.r][b.c]-g[a.r][a.c]);
  const gc=g.map(row=>[...row]);
  const seq=[];const used=new Set();
  while(seq.length<taps.length){
    let found=false;
    for(let idx=0;idx<taps.length;idx++){
      if(used.has(idx))continue;
      const t=taps[idx];
      if(gc[t.r][t.c]<0)continue;
      let ok=true;
      for(let k=0;k<n;k++){
        if(gc[t.r][k]>=0&&gc[t.r][k]-1<-1){ok=false;break}
        if(k!==t.r&&gc[k][t.c]>=0&&gc[k][t.c]-1<-1){ok=false;break}
      }
      if(!ok)continue;
      for(let k=0;k<n;k++){
        if(gc[t.r][k]>=0)gc[t.r][k]--;
        if(k!==t.r&&gc[k][t.c]>=0)gc[k][t.c]--;
      }
      seq.push({r:t.r,c:t.c});used.add(idx);found=true;break;
    }
    if(!found)return null;
  }
  return seq;
}

/* ═══ crack ═══ */
function crack(){
  if(busy||(!sol.length&&!grid)||tapped)return;
  /* if no precomputed solution, run universal solver */
  if(!sol.length){
    sol=universalSolver(grid);
    if(!sol){alert('No solution found for this grid.');return}
  }
  const savedGrid=grid.map(row=>[...row]);
  const savedTaps=taps;
  const bcBtn=$('bc');
  cracking=true;crackStop=false;
  busy=true;
  bcBtn.innerHTML=SVG_PLAY;
  bcBtn.classList.add('disabled');
  bcBtn.style.opacity='.6';
  let i=0;
  function step(){
    if(crackStop){cracking=false;busy=false;bcBtn.innerHTML=SVG_X;bcBtn.classList.remove('disabled');bcBtn.style.opacity='1';return;}
    if(i>=sol.length){
      setTimeout(()=>{
        if(crackStop){cracking=false;busy=false;bcBtn.innerHTML=SVG_X;bcBtn.classList.remove('disabled');bcBtn.style.opacity='1';return;}
        cracking=false;
        grid=savedGrid;
        taps=savedTaps;
        busy=false;
        bcBtn.innerHTML=SVG_X;
        bcBtn.classList.remove('disabled');
        bcBtn.style.opacity='1';
        popSc();
        render();
      },2000);
      return;
    }
    const{r,c}=sol[i];
    const el=$g.children[r*N+c];
    if(el){
      el.classList.add('hint');
      setTimeout(()=>{
        if(crackStop){cracking=false;busy=false;bcBtn.innerHTML=SVG_X;bcBtn.classList.remove('disabled');bcBtn.style.opacity='1';return;}
        el.classList.remove('hint');
        tap(r,c);
        i++;
        setTimeout(step,650);
      },450);
    }else{i++;step()}
  }
  step();
}

/* ═══ particles ═══ */
let parts=[];
let shockwaves=[];
let rings=[];
let diamonds=[];
let cellCenters=[];
let pendingFx=null;
function resizeCv(){
  const w=$('gwrap');
  $cv.width=w.offsetWidth;
  $cv.height=w.offsetHeight;
  // Cache cell center coords (relative to canvas) so shockwave head hits are O(1)
  cellCenters.length=0;
  const gridEl=$g;
  const cvr=$cv.getBoundingClientRect();
  for(let i=0;i<gridEl.children.length;i++){
    const cr=gridEl.children[i].getBoundingClientRect();
    cellCenters.push({
      r:Math.floor(i/N), c:i%N,
      x:cr.left-cvr.left+cr.width/2,
      y:cr.top-cvr.top+cr.height/2,
      half:cr.width/2
    });
  }
}

function emit(r,c){
  const el=$g.children[r*N+c];if(!el)return;
  const cr=el.getBoundingClientRect(),cvr=$cv.getBoundingClientRect();
  const x=cr.left-cvr.left+cr.width/2, y=cr.top-cvr.top+cr.height/2;
  const cols=theme==='valley'
    ?['#f5ebe0','#eddecf','#cdc1b4','#b87060','#c8b860','#6baa9f','#d4a373','#a98467']
    :['#ffd700','#ff6b6b','#4ecdc4','#a855f7','#3498db','#2ecc71','#ff8c00','#ffffff'];
  // Burst of 32 particles (up from 10): wide cone + slow drifting sparks
  for(let i=0;i<24;i++){
    const a=Math.PI*2*i/24+Math.random()*.6;
    const sp=1.8+Math.random()*4;
    parts.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      sz:theme==='valley'?3+Math.random()*5:2+Math.random()*4,
      c:cols[Math.floor(Math.random()*cols.length)],
      life:1,dec:.01+Math.random()*.015,
      sq:theme==='pixel',
      trail:[]
    });
  }
  // White-hot inner sparks (intense bright dots near origin)
  for(let i=0;i<10;i++){
    const a=Math.random()*Math.PI*2;
    const sp=0.4+Math.random()*1.8;
    parts.push({
      x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      sz:1.5+Math.random()*2.5,
      c:'#fff',
      life:1,dec:.035+Math.random()*.025,
      sq:false,trail:[]
    });
  }
  // Expanding rings (3 concentric for rich explosion feel)
  rings.push({x,y,r:0,life:1,col:theme==='pixel'?'#ffd700':'#b87060',w:3});
  rings.push({x,y,r:0,life:1,col:theme==='pixel'?'#ff6b6b':'#d4a373',w:1.5,delay:4});
  rings.push({x,y,r:0,life:1,col:'#fff',w:0.8,delay:8});
}

/* ═══ shockwave ═══ */
function emitSW(r,c){
  const el=$g.children[r*N+c];if(!el)return;
  const cr=el.getBoundingClientRect(),cvr=$cv.getBoundingClientRect();
  const cx=cr.left-cvr.left+cr.width/2, cy=cr.top-cvr.top+cr.height/2;
  const isP=theme==='pixel';
  const col=isP?'#ffd700':'#b87060';
  [{dx:0,dy:-1},{dx:0,dy:1},{dx:-1,dy:0},{dx:1,dy:0}].forEach(d=>{
    shockwaves.push({x:cx,y:cy,dx:d.dx,dy:d.dy,pos:0,spd:isP?14:9,life:1,col});
  });
  // Rotated 45° diamond square at click center — beams appear to emit from its corners
  diamonds.push({x:cx,y:cy,sz:cr.width*0.45,life:1,dec:.025,col:isP?'#ffd700':'#fff'});
}

function tickSW(){
  // Trigger cell-level visual fx when shockwave head enters each affected cell
  if(pendingFx){
    for(const cell of pendingFx.affected){
      if(cell.done)continue;
      // Hit when shockwave head is within this cell's bounds (on the same row or col)
      const cc=cellCenters[cell.key];
      if(!cc)continue;
      const sameRow=cell.r===pendingFx._tapRow;
      const sameCol=cell.c===pendingFx._tapCol;
      const targetX=sameRow?cc.x:pendingFx._tapCx;
      const targetY=sameCol?cc.y:pendingFx._tapCy;
      // Cell distance from tap point (in pixels, same axis as the beam)
      const dx=sameRow?Math.abs(targetX-pendingFx._tapCx):0;
      const dy=sameCol?Math.abs(targetY-pendingFx._tapCy):0;
      // Find a shockwave whose head has traveled far enough to reach this cell
      let hit=false;
      for(const s of shockwaves){
        // Must be a beam going in the direction of this cell
        if(sameRow && s.dy!==0) continue;
        if(sameCol && s.dx!==0) continue;
        const hx=s.x+s.dx*s.pos, hy=s.y+s.dy*s.pos;
        if(sameRow && Math.abs(hy-targetY)<cc.half*0.3){
          // Hit when head has traveled past this cell's center along X
          const fromTap=Math.abs(hx-pendingFx._tapCx);
          if(fromTap>=dx-cc.half*0.2){hit=true;break}
        }
        if(sameCol && Math.abs(hx-targetX)<cc.half*0.3){
          const fromTap=Math.abs(hy-pendingFx._tapCy);
          if(fromTap>=dy-cc.half*0.2){hit=true;break}
        }
      }
      if(hit){
        cell.done=true;
        const el=$g.children[cell.r*N+cell.c];
        if(el){el.classList.add('pop');setTimeout(()=>el.classList.remove('pop'),300)}
        upd(cell.r,cell.c);
        // If this cell is in `gone`, also trigger gone animation + particles when the head passes through center
        for(const g of pendingFx.gone){
          if(!g.done && g.key===cell.key){
            g.done=true;
            // Defer gone animation slightly so the head visibly passes through
            setTimeout(()=>{
              const gel=$g.children[g.r*N+g.c];
              if(gel){gel.classList.add('gone');setTimeout(()=>gel.classList.remove('gone'),400)}
              emit(g.r,g.c);
            },40);
          }
        }
      }
    }
    // Unlock busy when all animations done
    if(pendingFx.affected.every(c=>c.done) && pendingFx.gone.every(g=>g.done) && shockwaves.length===0){
      if(theme==='pixel'&&pendingFx.affected.length>0){$g.classList.add('shake');setTimeout(()=>$g.classList.remove('shake'),120)}
      busy=false;
      pendingFx=null;
    }
  }
  for(let i=shockwaves.length-1;i>=0;i--){
    const s=shockwaves[i];
    s.pos+=s.spd;s.life-=.028;
    if(s.life<=0){shockwaves.splice(i,1);continue}
    const hx=s.x+s.dx*s.pos, hy=s.y+s.dy*s.pos;
    const len=Math.min(s.pos,$cv.width);
    const lx=s.x+s.dx*len, ly=s.y+s.dy*len;
    ctx.save();
    // Outer glow trail
    ctx.strokeStyle=s.col;
    ctx.lineWidth=5+s.life*6;
    ctx.globalAlpha=s.life*0.25;
    ctx.lineCap='round';
    ctx.shadowColor=s.col;
    ctx.shadowBlur=20*s.life;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(lx,ly);ctx.stroke();
    // Mid beam
    ctx.lineWidth=2.5+s.life*3;
    ctx.globalAlpha=s.life*0.5;
    ctx.shadowBlur=12*s.life;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(lx,ly);ctx.stroke();
    // Bright core beam
    ctx.lineWidth=1.2+s.life*1.5;
    ctx.globalAlpha=s.life*0.85;
    ctx.strokeStyle='#fff';
    ctx.shadowColor='#fff';
    ctx.shadowBlur=8*s.life;
    ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(lx,ly);ctx.stroke();
    // Head halo (outer)
    ctx.globalAlpha=s.life*0.7;
    ctx.shadowColor=s.col;
    ctx.shadowBlur=18*s.life;
    ctx.fillStyle=s.col;
    ctx.beginPath();ctx.arc(hx,hy,4+s.life*5,0,Math.PI*2);ctx.fill();
    // Head halo (bright)
    ctx.globalAlpha=s.life;
    ctx.shadowColor='#fff';
    ctx.shadowBlur=20*s.life;
    ctx.fillStyle=s.col;
    ctx.beginPath();ctx.arc(hx,hy,2.5+s.life*3,0,Math.PI*2);ctx.fill();
    // Head center
    ctx.globalAlpha=s.life;
    ctx.shadowBlur=10*s.life;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(hx,hy,1.5+s.life*2,0,Math.PI*2);ctx.fill();
    ctx.restore();
  }
}

function tickParts(){
  ctx.clearRect(0,0,$cv.width,$cv.height);
  tickSW();
  // Expanding rings
  for(let i=rings.length-1;i>=0;i--){
    const r=rings[i];
    if(r.delay>0){r.delay--;continue}
    r.r+=2.8;r.life-=.022;
    if(r.life<=0){rings.splice(i,1);continue}
    ctx.save();
    ctx.strokeStyle=r.col;
    ctx.lineWidth=(r.w||2)+r.life*3;
    ctx.globalAlpha=r.life*0.7;
    ctx.shadowColor=r.col;
    ctx.shadowBlur=12*r.life;
    ctx.beginPath();
    ctx.arc(r.x,r.y,r.r,0,Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];
    // Save trail position
    if(p.trail && Math.random()>.4){
      p.trail.push({x:p.x,y:p.y});
      if(p.trail.length>4)p.trail.shift();
    }
    p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=p.dec;
    if(p.life<=0){parts.splice(i,1);continue}
    // Draw trail
    if(p.trail && p.trail.length>1){
      ctx.save();
      ctx.strokeStyle=p.c;
      ctx.lineWidth=p.sz*0.7;
      ctx.lineCap='round';
      for(let j=1;j<p.trail.length;j++){
        ctx.globalAlpha=(j/p.trail.length)*p.life*0.5;
        ctx.beginPath();
        ctx.moveTo(p.trail[j-1].x,p.trail[j-1].y);
        ctx.lineTo(p.trail[j].x,p.trail[j].y);
        ctx.stroke();
      }
      ctx.restore();
    }
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
    // Glow
    ctx.save();
    ctx.shadowColor=p.c;
    ctx.shadowBlur=8*p.life;
    if(p.sq)ctx.fillRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz);
    else{ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill()}
    ctx.restore();
  }
  ctx.globalAlpha=1;
  // Rotated 45° diamond — drawn FIRST so laser beams appear to come from its corners
  for(let i=diamonds.length-1;i>=0;i--){
    const d=diamonds[i];
    d.life-=d.dec;
    if(d.life<=0){diamonds.splice(i,1);continue}
    const t=1-d.life;
    const hold=t<0.4?1:1-(t-0.4)/0.6;
    const sz=d.sz*(0.5+hold*0.5);
    ctx.save();
    ctx.translate(d.x,d.y);
    ctx.rotate(Math.PI/4);
    // Strong dark filled core — high contrast so laser head halos don't wash it out
    ctx.shadowColor='#000';
    ctx.shadowBlur=20*hold;
    ctx.fillStyle='#1a1a1a';
    ctx.globalAlpha=hold*0.85;
    ctx.fillRect(-sz/2,-sz/2,sz,sz);
    // Bright outer border
    ctx.globalAlpha=hold;
    ctx.shadowColor=d.col;
    ctx.shadowBlur=18*hold;
    ctx.strokeStyle=d.col;
    ctx.lineWidth=3+hold*3;
    ctx.strokeRect(-sz/2,-sz/2,sz,sz);
    // White inner border
    ctx.globalAlpha=hold*0.95;
    ctx.shadowColor='#fff';
    ctx.shadowBlur=10*hold;
    ctx.strokeStyle='#fff';
    ctx.lineWidth=1.5;
    const pad=3;
    ctx.strokeRect(-sz/2+pad,-sz/2+pad,sz-pad*2,sz-pad*2);
    ctx.restore();
  }
  ctx.globalAlpha=1;
  // Fire win/fail banner only after ALL animation state arrays have drained.
  tryJudge();
  requestAnimationFrame(tickParts);
}

/* ═══ win/fail banner timing ═══ */
// Fires after every animation frame: when shockwaves/rings/diamonds/parts are all empty
// AND pendingFx is null AND there's a stored win/fail result, show the banner.
// This guarantees the banner never appears before the player has seen the laser + particles.
function tryJudge(){
  if(!pendingResult)return;
  if(busy||pendingFx)return;
  if(shockwaves.length||rings.length||diamonds.length||parts.length)return;
  var r=pendingResult; pendingResult=null;
  if(r==='win')showWin();
  else if(r==='fail')showFail();
}

/* ═══ watchdog ═══ */
setInterval(function(){
  // Don't show stuck banner mid-animation — wait for current tap's fx to fully resolve
  if(typeof busy!=='undefined' && busy)return;
  if(typeof pendingFx!=='undefined' && pendingFx)return;
  if(typeof shockwaves!=='undefined' && shockwaves.length)return;
  var rem=0;
  for(var r=0;r<N;r++)for(var c=0;c<N;c++)if(grid[r][c]>=0)rem++;
  var rmEl=document.getElementById('rm');
  if(rmEl)rmEl.textContent=rem;
  if(rem>0&&rem<TARGET&&!cracking&&!document.getElementById('stuckBanner')){
    var div=document.createElement('div');
    div.id='stuckBanner';
    div.innerHTML='<div style="background:var(--hdr,#f5ebe0);border:2px solid var(--accent,#b87060);border-radius:16px;padding:32px 40px;text-align:center;max-width:340px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.5)"><div style="font-size:48px;margin-bottom:8px">✗</div><h2 style="font-size:24px;font-weight:300;letter-spacing:4px;margin-bottom:12px">'+t('stuckTitle')+'</h2><p style="font-size:16px;margin-bottom:8px">'+t('stuckMsg',TARGET)+'</p><p style="font-size:14px;color:#8b7e74;margin-bottom:16px">'+t('stuckSub')+'</p><div style="display:flex;gap:12px;justify-content:center"><button id="stuckRetry" style="background:var(--accent,#b87060);color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:14px;font-weight:bold;cursor:pointer">'+t('restart')+'</button><button id="stuckNew" style="background:var(--cell-empty,rgba(187,173,160,.3));color:var(--txt,#5a4e44);border:1px solid var(--grid,#cdc1b4);border-radius:10px;padding:12px 24px;font-size:14px;font-weight:bold;cursor:pointer">'+t('newGame')+'</button></div></div>';
    div.style.cssText='position:fixed;top:0;left:0;right:0;bottom:0;z-index:99999;background:rgba(0,0,0,0.7);display:flex;align-items:center;justify-content:center;';
    document.body.appendChild(div);
    document.getElementById('stuckRetry').onclick=function(){
      document.getElementById('stuckBanner').remove();
      restartLevel();
    };
    document.getElementById('stuckNew').onclick=function(){
      document.getElementById('stuckBanner').remove();
      newGame();
    };
  }
},300);

/* ═══ Level selection & launcher ═══ */
function startLevel(level){
  const cfg=LEVELS[level];
  if(!cfg)return;
  N=cfg.n;MAX=cfg.max;TARGET=TARGET_FN(N);
  currentLevel=level;
  $g.className='n'+N;
  // Hide launcher, show game UI (inline style like original HTML)
  $('launcher').classList.add('hide');
  $('game').style.display='';
  $('ftr').style.display='';
  $('bu').style.display='';
  $('statsRow').style.display='';
  $('seedRow').style.display='';
  $('seedBtns').style.display='';
  applyLang();
  newGame();
}
function showLauncher(){
  crackStop=true;cracking=false;busy=false;tapped=false;
  $('launcher').classList.remove('hide');
  $('game').style.display='none';
  $('ftr').style.display='none';
  $('bu').style.display='none';
  $('statsRow').style.display='none';
  $('seedRow').style.display='none';
  $('seedBtns').style.display='none';
}
/* Build the level preview tiles (sample visual) */
function buildPreviews(){
  for(const lvl of [4,6,8,10]){
    const el=document.getElementById('preview'+lvl);
    if(!el)continue;
    el.innerHTML='';
    const total=lvl*lvl;
    for(let i=0;i<total;i++){
      const d=document.createElement('div');
      // Simple deterministic coloring for preview
      const v=((i*7+(i/lvl|0))*3)%LEVELS[lvl].max;
      d.style.background=PALETTE[v].v;
      d.style.opacity=0.4+(v/LEVELS[lvl].max)*0.6;
      el.appendChild(d);
    }
  }
  document.querySelectorAll('.level-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const lv=parseInt(btn.dataset.level,10);
      startLevel(lv);
    });
  });
}

/* ═══ init ═══ */
function init(){
  buildPreviews();
  load();
  document.documentElement.dataset.theme=theme;
  $('bt').innerHTML=theme==='valley'?SVG_DIAMOND:SVG_SQUARE;
  resizeCv();window.addEventListener('resize',resizeCv);
  tickParts();
  $g.className='n'+N;
  // Prime grid so watchdog setInterval (300ms) doesn't read undefined[0]
  grid = Array.from({length:N}, () => Array(N).fill(-1));
  applyLang();
  // CROSS logo (top-left) → return to launcher
  $('logo').addEventListener('click', showLauncher);
  $('bn2').addEventListener('contextmenu',e=>{e.preventDefault();showLauncher();});
  $('blang').addEventListener('click',()=>{lang=lang==='en'?'cn':'en';applyLang();save();});
  $('bc').addEventListener('click',crack);
  $('bn2').addEventListener('click',newGame);
  $('bt').addEventListener('click',togTheme);
  $('bu').addEventListener('click',undo);
  $('bh').addEventListener('click',showHelp);
  $('bCopySeed').addEventListener('click',()=>{
    navigator.clipboard.writeText(curSeed.toString(16).padStart(8,'0')).then(()=>{
      const btn=$('bCopySeed');const old=btn.textContent;btn.style.minWidth=btn.offsetWidth+'px';btn.textContent=t('copied');setTimeout(()=>{btn.textContent=old;btn.style.minWidth='';},1200);
    });
  });
  $('bLoadSeed').addEventListener('click',()=>{
    const ov=$('seedOv');ov.classList.remove('hide');
    $('seedIn').value='';
    const card=ov.querySelector('.help-card');if(card)card.style.transform='';
    setTimeout(()=>$('seedIn').focus(),100);
  });
  $('seedOv').addEventListener('click',e=>{if(e.target===$('seedOv'))$('seedOv').classList.add('hide');});
  $('seedConfirm').addEventListener('click',loadSeedFromInput);
  $('seedIn').addEventListener('keydown',e=>{if(e.key==='Enter')loadSeedFromInput();});
  // Keyboard viewport handling
  if(window.visualViewport){
    const seedOv=$('seedOv');
    const adjustVP=()=>{
      if(seedOv.classList.contains('hide'))return;
      const card=seedOv.querySelector('.help-card');
      if(!card)return;
      const vp=window.visualViewport;
      const kbH=Math.max(0,window.innerHeight-vp.height-vp.offsetTop);
      card.style.transform=kbH>50?'translateY(-'+Math.min(kbH*0.4,120)+'px)':'';
    };
    window.visualViewport.addEventListener('resize',adjustVP);
    window.visualViewport.addEventListener('scroll',adjustVP);
  }
  $('bImport').addEventListener('click',()=>{
    $('importOv').classList.remove('hide');
    $('gridIn').value='';
    setTimeout(()=>$('gridIn').focus(),100);
  });
  $('importOv').addEventListener('click',e=>{if(e.target===$('importOv'))$('importOv').classList.add('hide');});
  $('importConfirm').addEventListener('click',importGrid);
  $('bx').addEventListener('click',()=>{
    const action=$('bx').dataset.action;
    if(action==='retry')restartLevel();else newGame();
  });
}
init();
})();
</script>
