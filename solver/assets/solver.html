<!DOCTYPE html>
<html lang="en" data-theme="valley">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Cross Solver</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
:root{
  --bg1:#f5ebe0;--bg2:#eddecf;--hdr:rgba(245,235,224,.92);
  --grid:#cdc1b4;--cell-empty:rgba(187,173,160,.12);
  --txt:#5a4e44;--txt-l:#f9f6f2;--txt-m:#8b7e74;
  --accent:#b87060;--glow:rgba(184,112,96,.35);--sh:rgba(90,78,68,.12);
  --rad:16px;--crad:8px;--gap:4px;
  --font:'Segoe UI',system-ui,-apple-system,sans-serif;--speed:.3s;
  --mono:'Courier New',Consolas,monospace;
}
[data-theme="pixel"]{
  --bg1:#0a0a1a;--bg2:#12122a;--hdr:rgba(10,10,26,.95);
  --grid:#1a1a3a;--cell-empty:rgba(30,30,80,.25);
  --txt:#e0e0ff;--txt-l:#fff;--txt-m:#6060a0;
  --accent:#ffd700;--glow:rgba(255,215,0,.3);--sh:rgba(0,0,0,.4);
  --rad:4px;--crad:2px;--gap:3px;
  --font:'Courier New',Consolas,monospace;--speed:.15s;
}
html,body{height:100%;background:var(--bg1);color:var(--txt);font-family:var(--font);font-size:14px;overflow-x:hidden}
body{display:flex;justify-content:center}
#app{
  position:relative;width:100%;max-width:440px;min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:env(safe-area-inset-top) 12px 12px;
}
header{width:100%;display:flex;flex-direction:column;gap:8px;padding:10px 0}
.hdr-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-size:28px;font-weight:300;letter-spacing:8px;color:var(--accent)}
[data-theme="pixel"] .logo{font-weight:700;text-shadow:0 0 12px var(--glow)}
.hdr-btns{display:flex;gap:6px;align-items:center}
.btn{font-family:var(--font);font-size:13px;font-weight:600;letter-spacing:1px;
  padding:10px 20px;border:none;border-radius:var(--crad);cursor:pointer;
  background:var(--accent);color:var(--txt-l);transition:all var(--speed)}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.35;cursor:default;pointer-events:none}
.btn-sm{font-size:11px;padding:5px 12px;letter-spacing:.5px}
.btn-icon{width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--grid);border-radius:var(--crad);background:transparent;
  color:var(--txt);cursor:pointer;font-size:16px}
.btn-icon:active{transform:scale(.9)}
[data-theme="pixel"] .btn-icon{background:rgba(30,30,80,.85)}
.lang-btn{font-family:var(--font);font-size:11px;font-weight:700;padding:4px 8px;
  background:transparent;color:var(--txt);border:1px solid var(--grid);
  border-radius:var(--crad);cursor:pointer;line-height:1}
[data-theme="pixel"] .lang-btn{border-color:rgba(255,255,255,.15)}

/* Section title */
.section-title{font-size:13px;font-weight:600;letter-spacing:2px;color:var(--accent);
  text-transform:uppercase;margin:16px 0 8px;width:100%;text-align:center}

/* Grid */
#gwrap{position:relative;width:min(80vw,340px);aspect-ratio:1;border-radius:var(--rad);overflow:hidden}
#grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(10,1fr);gap:var(--gap);padding:var(--gap);background:var(--grid)}
.cell{border-radius:var(--crad);transition:background var(--speed);aspect-ratio:1}
.cell.empty{background:var(--cell-empty)}

/* Import area */
.import-area{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center;margin:8px 0}
.grid-textarea{width:100%;max-width:360px;padding:10px;border:1px solid var(--grid);
  border-radius:var(--crad);font-size:12px;font-family:var(--mono);
  background:var(--bg1);color:var(--txt);resize:none;outline:none;line-height:1.5}
.grid-textarea:focus{border-color:var(--accent)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Seed input */
.seed-area{width:100%;max-width:360px;display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0}
.seed-input{flex:1;padding:8px 12px;border:1px solid var(--grid);border-radius:var(--crad);
  font-size:14px;font-family:var(--mono);background:var(--bg1);color:var(--txt);
  text-align:center;letter-spacing:3px;outline:none}
.seed-input:focus{border-color:var(--accent)}

/* Solution output */
#output{width:100%;max-width:360px;margin-top:8px}
.sol-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sol-title{font-size:13px;font-weight:600;letter-spacing:1px;color:var(--accent)}
.sol-count{font-size:12px;color:var(--txt-m)}
.step-list{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow-y:auto;
  -webkit-overflow-scrolling:touch}
.step{display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:var(--crad);
  font-family:var(--mono);font-size:13px;letter-spacing:.5px;
  background:var(--cell-empty);transition:background var(--speed)}
.step:hover{background:var(--glow)}
.step-num{color:var(--accent);font-weight:700;min-width:56px}
.step-rc{color:var(--txt)}
.step-orig{font-size:11px;color:var(--txt-m);margin-left:auto}

/* Error / status */
.msg{font-size:13px;color:var(--txt-m);text-align:center;padding:12px;letter-spacing:.5px}
.msg.err{color:#e74c3c}

/* Copy btn */
.copy-btn{font-size:11px;padding:4px 10px;background:transparent;color:var(--accent);
  border:1px solid var(--accent);border-radius:var(--crad);cursor:pointer}
.copy-btn:active{transform:scale(.95)}

/* Footer */
footer{margin-top:auto;padding:10px 0;width:100%;display:flex;justify-content:center}
footer .btn-icon{position:absolute;right:12px;bottom:12px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hdr-top">
      <span class="logo">SOLVER</span>
      <div class="hdr-btns">
        <button class="lang-btn" id="blang">EN</button>
        <button class="btn-icon" id="bt">
          <svg width="16" height="16" viewBox="0 0 16 16"><polygon points="8,1 15,8 8,15,1,8" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="section-title" data-i18n="secImport">IMPORT GRID</div>

  <div class="import-area">
    <textarea class="grid-textarea" id="gridIn" rows="10" spellcheck="false"
      placeholder="3,3,2,7,6,2,3,2,5,2&#10;1,0,-1,4,3,-1,0,-1,4,-1&#10;..."></textarea>
    <div class="btn-row">
      <button class="btn btn-sm" id="bImport" data-i18n="solve">SOLVE</button>
      <button class="btn btn-sm" id="bClear" data-i18n="clear">CLEAR</button>
    </div>
  </div>

  <div class="section-title" data-i18n="secSeed">OR LOAD SEED</div>
  <div class="seed-area">
    <input class="seed-input" id="seedIn" maxlength="8" placeholder="xxxxxxxx" inputmode="hex">
    <button class="btn btn-sm" id="bSeed" data-i18n="load">LOAD</button>
  </div>

  <div class="section-title" data-i18n="secGrid">GRID</div>
  <div id="gwrap"><div id="grid"></div></div>

  <div id="output"></div>

  <footer>
    <button class="btn-icon" id="bt2">
      <svg width="16" height="16" viewBox="0 0 16 16"><polygon points="8,1 15,8 8,15,1,8" fill="currentColor" stroke="none"/></svg>
    </button>
  </footer>
</div>

<script>
(function(){
'use strict';

/* ═══ i18n ═══ */
const T={
  en:{
    secImport:'IMPORT GRID',secSeed:'OR LOAD SEED',secGrid:'GRID',
    solve:'SOLVE',clear:'CLEAR',load:'LOAD',
    errRows:'Need exactly 10 rows',errCols:'Each row needs 10 numbers',
    errSeed:'Invalid seed',noSol:'No solution found',
    steps:'steps',step:'Step',total:'Total',taps:'taps',
    copied:'Copied!',copySteps:'Copy Steps'
  },
  cn:{
    secImport:'导入网格',secSeed:'或加载种子',secGrid:'网格',
    solve:'求解',clear:'清除',load:'加载',
    errRows:'需要恰好 10 行',errCols:'每行需要 10 个数字',
    errSeed:'无效种子',noSol:'无解',
    steps:'步',step:'步骤',total:'总计',taps:'次点击',
    copied:'已复制!',copySteps:'复制步骤'
  }
};
let lang='en';
function t(k,n){let s=T[lang][k]||T.en[k]||k;if(n!=null)s=s.replace('{n}',n);return s}
function applyLang(){
  document.documentElement.lang=lang==='cn'?'zh':'en';
  $('blang').textContent=lang==='cn'?'CN':'EN';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.dataset.i18n;if(T[lang][k])el.textContent=T[lang][k];
  });
  $('gridIn').placeholder=lang==='cn'
    ?'3,3,2,7,6,2,3,2,5,2\n1,0,-1,4,3,-1,0,-1,4,-1\n...'
    :'3,3,2,7,6,2,3,2,5,2\n1,0,-1,4,3,-1,0,-1,4,-1\n...';
}

/* ═══ theme ═══ */
let theme='valley';
const CV=['#a8a098','#b86868','#c89060','#c8b860','#7aab6b','#6baa9f','#6b8fb8','#9b7fb8','#3d3535'];
const CP=['#7f8c8d','#e74c3c','#e67e22','#f1c40f','#2ecc71','#1abc9c','#3498db','#9b59b6','#2c3e50'];
const SVG_D='<svg width="16" height="16" viewBox="0 0 16 16"><polygon points="8,1 15,8 8,15,1,8" fill="currentColor" stroke="none"/></svg>';
const SVG_S='<svg width="14" height="14" viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" fill="currentColor" stroke="none"/></svg>';

function togTheme(){
  theme=theme==='valley'?'pixel':'valley';
  document.documentElement.dataset.theme=theme;
  $('bt').innerHTML=theme==='valley'?SVG_D:SVG_S;
  $('bt2').innerHTML=theme==='valley'?SVG_D:SVG_S;
  localStorage.setItem('cross_solver_t',theme);
  if(grid)renderGrid(grid);
}

/* ═══ util ═══ */
function $(id){return document.getElementById(id)}
const N=10;

/* ═══ PRNG ═══ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296}}

/* ═══ gen (for seed loading) ═══ */
function gen(seed){
  const rng=mulberry32(seed);
  const g=[],seq=[];
  for(let r=0;r<N;r++){g[r]=[];for(let c=0;c<N;c++)g[r][c]=-1}
  while(true){
    const r=Math.floor(rng()*N),c=Math.floor(rng()*N);
    let exceed=false;
    for(let i=0;i<N;i++){if(g[r][i]>=8||g[i][c]>=8){exceed=true;break}}
    if(exceed)break;
    for(let i=0;i<N;i++){g[r][i]++;if(i!==r)g[i][c]++}
    seq.push({r,c});
  }
  return{grid:g,sol:seq.reverse()};
}

/* ═══ solver ═══ */
function universalSolver(g){
  const n=N;
  const D=[];let T=0;
  for(let i=0;i<n;i++){D[i]=[];for(let j=0;j<n;j++){D[i][j]=g[i][j]>=0?g[i][j]+1:0;T+=D[i][j]}}
  if(T%19!==0)return null;
  const S=T/19;
  const Di=[],Ej=[];
  for(let i=0;i<n;i++){Di[i]=0;for(let j=0;j<n;j++)Di[i]+=D[i][j]}
  for(let j=0;j<n;j++){Ej[j]=0;for(let i=0;i<n;i++)Ej[j]+=D[i][j]}
  const A=[],B=[];
  for(let i=0;i<n;i++){A[i]=(Di[i]-S)/9;if(A[i]<0||A[i]!==Math.round(A[i]))return null}
  for(let j=0;j<n;j++){B[j]=(Ej[j]-S)/9;if(B[j]<0||B[j]!==Math.round(B[j]))return null}
  const taps=[];
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const z=A[i]+B[j]-D[i][j];
    if(g[i][j]>=0&&z<0)return null;
    if(g[i][j]<0&&z!==0)return null;
    for(let k=0;k<z;k++)taps.push({r:i,c:j});
  }
  taps.sort((a,b)=>g[b.r][b.c]-g[a.r][a.c]);
  const gc=g.map(row=>[...row]);
  const seq=[];const used=new Set();
  while(seq.length<taps.length){
    let found=false;
    for(let idx=0;idx<taps.length;idx++){
      if(used.has(idx))continue;
      const tp=taps[idx];
      if(gc[tp.r][tp.c]<0){used.add(idx);continue}
      let ok=true;
      for(let k=0;k<n;k++){
        if(gc[tp.r][k]>=0&&gc[tp.r][k]-1<-1){ok=false;break}
      }
      if(ok)for(let k=0;k<n;k++){
        if(k!==tp.r&&gc[k][tp.c]>=0&&gc[k][tp.c]-1<-1){ok=false;break}
      }
      if(!ok)continue;
      for(let k=0;k<n;k++){
        if(gc[tp.r][k]>=0)gc[tp.r][k]--;
        if(k!==tp.r&&gc[k][tp.c]>=0)gc[k][tp.c]--;
      }
      seq.push({r:tp.r,c:tp.c});used.add(idx);found=true;break;
    }
    if(!found)return null;
  }
  return seq;
}

/* ═══ grid state ═══ */
let grid=null;

/* ═══ render ═══ */
function renderGrid(g){
  const $g=$('grid');
  $g.innerHTML='';
  const colors=theme==='valley'?CV:CP;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const d=document.createElement('div');
    d.className='cell'+(g[r][c]<0?' empty':'');
    if(g[r][c]>=0)d.style.background=colors[g[r][c]];
    $g.appendChild(d);
  }
}

/* ═══ output ═══ */
function showResult(g,sol){
  const out=$('output');
  if(!sol){
    out.innerHTML='<div class="msg err">'+t('noSol')+'</div>';
    return;
  }
  let html='<div class="sol-header">';
  html+='<span class="sol-title">'+sol.length+' '+t('steps')+'</span>';
  html+='<button class="copy-btn" id="bCopy">'+t('copySteps')+'</button>';
  html+='</div>';
  html+='<div class="step-list">';
  for(let i=0;i<sol.length;i++){
    const s=sol[i];
    const pad=String(i+1).padStart(2,'0');
    const rPad=String(s.r+1).padStart(2,' ');
    const cPad=String(s.c+1).padStart(2,' ');
    html+='<div class="step">';
    html+='<span class="step-num">'+t('step')+' '+pad+'</span>';
    html+='<span class="step-rc">R '+rPad+' C '+cPad+'</span>';
    html+='</div>';
  }
  html+='</div>';
  out.innerHTML=html;

  $('bCopy').addEventListener('click',function(){
    let text='';
    for(let i=0;i<sol.length;i++){
      const pad=String(i+1).padStart(2,'0');
      text+=t('step')+' '+pad+', R '+(sol[i].r+1)+' C '+(sol[i].c+1)+'\n';
    }
    navigator.clipboard.writeText(text.trim()).then(()=>{
      const btn=$('bCopy');const old=btn.textContent;
      btn.textContent=t('copied');setTimeout(()=>btn.textContent=old,1200);
    });
  });
}

/* ═══ actions ═══ */
function solveFromTextarea(){
  const text=$('gridIn').value.trim();
  const rows=text.split(/[\n\r]+/).filter(r=>r.trim());
  if(rows.length!==10){showErr(t('errRows'));return}
  const g=[];
  for(let r=0;r<10;r++){
    const cells=rows[r].split(/[,\s]+/).map(Number);
    if(cells.length!==10||cells.some(isNaN)){showErr(t('errCols'));return}
    g.push(cells);
  }
  grid=g;
  renderGrid(g);
  const sol=universalSolver(g);
  showResult(g,sol);
}

function loadSeed(){
  const hex=$('seedIn').value.trim().replace(/^0x/i,'');
  const seed=parseInt(hex,16);
  if(isNaN(seed)||hex.length===0){
    $('seedIn').style.borderColor='#e74c3c';
    setTimeout(()=>$('seedIn').style.borderColor='',1500);
    showErr(t('errSeed'));return;
  }
  const r=gen(seed>>>0);
  grid=r.grid;
  renderGrid(grid);
  $('gridIn').value=grid.map(row=>row.join(',')).join('\n');
  const sol=r.sol;
  showResult(grid,sol);
}

function showErr(msg){
  $('output').innerHTML='<div class="msg err">'+msg+'</div>';
}

function clearAll(){
  $('gridIn').value='';
  $('seedIn').value='';
  $('output').innerHTML='';
  grid=null;
  const $g=$('grid');$g.innerHTML='';
  for(let i=0;i<100;i++){const d=document.createElement('div');d.className='cell empty';$g.appendChild(d)}
}

/* ═══ init ═══ */
function init(){
  theme=localStorage.getItem('cross_solver_t')||'valley';
  lang=localStorage.getItem('cross_solver_l')||'en';
  document.documentElement.dataset.theme=theme;
  $('bt').innerHTML=theme==='valley'?SVG_D:SVG_S;
  $('bt2').innerHTML=theme==='valley'?SVG_D:SVG_S;
  applyLang();
  clearAll();

  $('bt').addEventListener('click',togTheme);
  $('bt2').addEventListener('click',togTheme);
  $('blang').addEventListener('click',()=>{
    lang=lang==='en'?'cn':'en';
    localStorage.setItem('cross_solver_l',lang);
    applyLang();
    if(grid){const sol=universalSolver(grid);showResult(grid,sol)}
  });
  $('bImport').addEventListener('click',solveFromTextarea);
  $('bClear').addEventListener('click',clearAll);
  $('bSeed').addEventListener('click',loadSeed);
  $('seedIn').addEventListener('keydown',e=>{if(e.key==='Enter')loadSeed()});
}
init();
})();
</script>
</body>
</html>
